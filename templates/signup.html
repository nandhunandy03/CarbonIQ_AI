<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up - CarbonIQ AI</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
  body{background:#f0f7f2;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .signup-box{background:#fff;padding:40px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08);width:350px;}
  .signup-box h2{margin-bottom:20px;color:#1a3d2e;}
  .signup-box input{width:100%;padding:12px;margin-bottom:14px;border:1px solid #ddd;border-radius:8px;font-size:14px;}
  .signup-box button{width:100%;padding:12px;background:#1a3d2e;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;}
  .signup-box p{margin-top:14px;font-size:13px;text-align:center;color:#6b7280;}
  .signup-box a{color:#22c55e;text-decoration:none;}
  .flash{background:#fee2e2;color:#b91c1c;padding:10px;border-radius:6px;margin-bottom:14px;font-size:13px;}
</style>
</head>
<body>
  <div class="signup-box">
    <h2>Create Account</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST" action="/signup">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="/login">Login</a></p>
  </div>
</body>
</html>
