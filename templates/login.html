<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - CarbonIQ AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f5f7f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-container{
width:400px;
background:#fff;
padding:35px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.logo{
text-align:center;
font-size:30px;
font-weight:bold;
margin-bottom:10px;
}

.logo span{
color:#22c55e;
}

h2{
text-align:center;
margin-bottom:25px;
color:#1a3d2e;
}

.input-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

input:focus{
outline:none;
border-color:#22c55e;
}

button{
width:100%;
padding:13px;
background:#1a3d2e;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#22c55e;
}

.signup{
text-align:center;
margin-top:20px;
}

.signup a{
text-decoration:none;
color:#22c55e;
font-weight:bold;
}

</style>

</head>

<body>

<div class="login-container">

<div class="logo">
🌱 CarbonIQ <span>AI</span>
</div>

<h2>Login</h2>

<form action="{{ url_for('login') }}" method="POST">

    <div class="input-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>
    </div>

    <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>
    </div>

    <button type="submit">Login</button>

</form>

<div class="signup">
Don't have an account?
<a href="{{ url_for('signup') }}">Sign Up</a>
</div>

</div>

</body>
</html>
