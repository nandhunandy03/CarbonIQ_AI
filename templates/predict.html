<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carbon Prediction</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#eef7f1;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:700px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#15803d;
margin-bottom:25px;
}

.input-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input,select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#16a34a;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#15803d;
}

.back{
margin-top:20px;
text-align:center;
}

.back a{
text-decoration:none;
color:#15803d;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>🌿 Carbon Emission </h1>

<form id="predictForm" action="/result" method="POST">
<div class="input-group">
<label>Electricity Consumption (kWh)</label>
<input type="number" name="electricity" required>
</div>

<div class="input-group">
<label>Fuel Consumption (Litres)</label>
<input type="number" name="fuel" required>
</div>

<div class="input-group">
<label>Water Usage (Litres)</label>
<input type="number" name="water" required>
</div>

<div class="input-group">
<label>Production Quantity (kg)</label>
<input type="number" name="production" required>
</div>

<div class="input-group">
<label>Machine Hours</label>
<input type="number" name="machine_hours" required>
</div>

<div class="input-group">
<label>Fabric Type</label>

<select name="fabric">

<option>Cotton</option>
<option>Polyester</option>
<option>Silk</option>
<option>Wool</option>

</select>

</div>

<button type="submit">

Predict Carbon Emission

</button>

</form>

<div class="back">

<a href="{{ url_for('dashboard') }}">

⬅ Back to Dashboard

</a>

</div>

</div>
<script>
document.getElementById("predictForm").addEventListener("submit", function(e) {

    e.preventDefault();   // <-- IDHA ADD PANNUNGA - page navigate aagаmал் நிறுத்தும்

    let formData = new FormData(this);

    fetch("/check_alert", {
        method: "POST",
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.alert) {
         const sound = document.getElementById("alertSound");
        sound.play().catch(err => console.log(err));

        setTimeout(() => {
        alert(data.message);
   }, 300);
}
        
        // Popup kaattina piragு (illa illama), form-a manual-a submit pannunga
        e.target.submit();
    });
});
</script>
<audio id="alertSound" src="/static/sounds/alert.mp3" preload="auto"></audio>

<script>
function playAlertSound() {
const sound = document.getElementById("alertSound");
sound.play();
}

</script>

</body>
</html>
